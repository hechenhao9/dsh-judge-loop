<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
  <rect width="1200" height="640" fill="#0d1117"/>

  <text x="60" y="58" fill="#e6edf3" font-size="26" font-weight="600">一次真实运行：一份对外交付物，六维标准</text>
  <text x="60" y="88" fill="#8b949e" font-size="15">题目：给越南/印尼 Expo 的三个中小品牌写 60 秒英文介绍 + 一页式说明 ｜ 教授盲写标准，导师不知道标准怎么来的</text>

  <!-- 图例 -->
  <rect x="60" y="112" width="12" height="12" fill="#30363d"/>
  <text x="80" y="123" fill="#8b949e" font-size="13">v1 自评 65.2</text>
  <rect x="200" y="112" width="12" height="12" fill="#2ea043"/>
  <text x="220" y="123" fill="#8b949e" font-size="13">v8 外审 100</text>

  <!-- 基线 -->
  <line x1="150" y1="520" x2="1140" y2="520" stroke="#30363d" stroke-width="1"/>
  <line x1="150" y1="120" x2="150" y2="520" stroke="#30363d" stroke-width="1"/>
  <text x="120" y="126" fill="#484f58" font-size="11" text-anchor="end">10</text>
  <text x="120" y="326" fill="#484f58" font-size="11" text-anchor="end">5</text>
  <text x="120" y="524" fill="#484f58" font-size="11" text-anchor="end">0</text>

  <!-- 六组柱：x 起点 180，组距 155 -->
  <!-- d1 7 -> 10, w14 -->
  <rect x="180" y="240" width="46" height="280" fill="#30363d"/>
  <rect x="234" y="120" width="46" height="400" fill="#2ea043"/>
  <text x="230" y="548" fill="#e6edf3" font-size="13" text-anchor="middle">时长与停顿</text>
  <text x="230" y="568" fill="#484f58" font-size="11" text-anchor="middle">w14 · 60 秒能念完</text>
  <text x="230" y="584" fill="#484f58" font-size="11" text-anchor="middle">7 → 10</text>

  <!-- d2 10 -> 10, w22 -->
  <rect x="335" y="120" width="46" height="400" fill="#30363d"/>
  <rect x="389" y="120" width="46" height="400" fill="#2ea043"/>
  <text x="385" y="548" fill="#e6edf3" font-size="13" text-anchor="middle">数字可查</text>
  <text x="385" y="568" fill="#484f58" font-size="11" text-anchor="middle">w22 · 每个数字带行号</text>
  <text x="385" y="584" fill="#484f58" font-size="11" text-anchor="middle">10 → 10</text>

  <!-- d3 4 -> 10, w16 -->
  <rect x="490" y="360" width="46" height="160" fill="#30363d"/>
  <rect x="544" y="120" width="46" height="400" fill="#2ea043"/>
  <text x="540" y="548" fill="#e6edf3" font-size="13" text-anchor="middle">口径统一</text>
  <text x="540" y="568" fill="#484f58" font-size="11" text-anchor="middle">w16 · 只许一套收费口径</text>
  <text x="540" y="584" fill="#484f58" font-size="11" text-anchor="middle">4 → 10</text>

  <!-- d4 4 -> 10, w22 -->
  <rect x="645" y="360" width="46" height="160" fill="#30363d"/>
  <rect x="699" y="120" width="46" height="400" fill="#2ea043"/>
  <text x="695" y="548" fill="#e6edf3" font-size="13" text-anchor="middle">正面回答</text>
  <text x="695" y="568" fill="#484f58" font-size="11" text-anchor="middle">w22 · 前两段答完两个决策</text>
  <text x="695" y="584" fill="#484f58" font-size="11" text-anchor="middle">4 → 10</text>

  <!-- d5 7 -> 10, w14 -->
  <rect x="800" y="240" width="46" height="280" fill="#30363d"/>
  <rect x="854" y="120" width="46" height="400" fill="#2ea043"/>
  <text x="850" y="548" fill="#e6edf3" font-size="13" text-anchor="middle">能直接转发</text>
  <text x="850" y="568" fill="#484f58" font-size="11" text-anchor="middle">w14 · 一页式 ≤450 词</text>
  <text x="850" y="584" fill="#484f58" font-size="11" text-anchor="middle">7 → 10</text>

  <!-- d6 7 -> 10, w12 -->
  <rect x="955" y="240" width="46" height="280" fill="#30363d"/>
  <rect x="1009" y="120" width="46" height="400" fill="#2ea043"/>
  <text x="1005" y="548" fill="#e6edf3" font-size="13" text-anchor="middle">不编背书</text>
  <text x="1005" y="568" fill="#484f58" font-size="11" text-anchor="middle">w12 · 抽检通过 ≠ 质量保证</text>
  <text x="1005" y="584" fill="#484f58" font-size="11" text-anchor="middle">7 → 10</text>

  <!-- 总分 -->
  <text x="1140" y="160" fill="#8b949e" font-size="12" text-anchor="end">65.2 / 100</text>
  <text x="1140" y="180" fill="#3fb950" font-size="22" font-weight="600" text-anchor="end">100.0 / 100</text>

  <!-- 底部：三次被判分人拦下来的事 -->
  <text x="60" y="612" fill="#484f58" font-size="12">这一轮里，独立判分人拦下过三件事：① 我编了一整句 PDF 引文（PDF 里根本没有那两个词）② 我把「我认为满分」当成满分 ③ 我想删掉一版旧稿让检查计数器复位</text>
  <text x="60" y="630" fill="#484f58" font-size="12">证据留在仓库里：legacy/ 是旧版存档，CHANGELOG 1.1.0 记了为什么砍掉机械闸门</text>
</svg>
