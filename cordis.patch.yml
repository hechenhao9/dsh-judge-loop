# dsh-judge-loop：交付前的满分闸门（双团队版）
#
# 安装即注册三个技能：
#   judge-loop  主流程（两个团队怎么协作、gate 命令、退出码）
#   professor   教授团队：只读题目与素材，产出 rubric.json，决定作品上限
#   tutor       导师团队：按 rubric 一步做到满分，可向教授取经
#
# 插件自带空配置，绝不弄崩启动；无需任何账号或密钥。可选配置：
#
#   - id: dsh-judge-loop
#     config:
#       maxRounds: 5        # 可选：轮次上限，默认 5
#       strictRubric: true  # 可选：criterion 必须含可抽查对象，默认 true
#
- insert:
    - id: dsh-judge-loop
      name: dsh-judge-loop
      config: {}
